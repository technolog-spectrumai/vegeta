[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mancha"
version = "0.1.0"
description = "GPU-accelerated Lattice Boltzmann (D3Q19) for incompressible flow: a NumPy reference and a Triton backend"
readme = "README.md"
license = { text = "Proprietary - internal use only" }
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["torch>=2.1", "triton>=2.1"]   # the Triton backend, imported lazily
vtk = ["pyvista>=0.42"]               # .vti export through VTK (a built-in writer is used without it)
plot = ["matplotlib>=3.7"]            # mancha.io.plots
test = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "gpu: needs the Triton backend (CUDA, or TRITON_INTERPRET=1 on the CPU)",
    "slow: longer regression runs",
]
