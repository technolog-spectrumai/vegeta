[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ogma"
version = "0.1.0"
description = "The physics of standard machine parts: what they are (data) and do (behaviour)"
readme = "README.md"
license = { text = "Proprietary - internal use only" }
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
cad = ["cadquery>=2.4"]          # og.cad, imported lazily
mujoco = ["mujoco>=3.1"]         # og.mujoco.compile_check, imported lazily

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["ogma"]

[tool.setuptools.package-data]
ogma = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
