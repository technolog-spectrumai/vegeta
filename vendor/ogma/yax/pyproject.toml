[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yax"
version = "0.1.0"
description = "Design interchange: a directory with an STL and a small JSON manifest (units, frame, mass properties)"
readme = "README.md"
license = { text = "Proprietary - internal use only" }
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
yax = "yax.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["yax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
