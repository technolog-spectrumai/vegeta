[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mellonia"
version = "0.1.0"
description = "Standalone 3D-print manufacturability: STL + explicit settings -> PrusaSlicer -> G-code metrics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest"]

[project.scripts]
mellonia = "mellonia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_prusaslicer: needs the PrusaSlicer executable",
  "slow: long-running test",
]
