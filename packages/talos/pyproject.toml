[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
version = "0.1.0"
description = "Standalone linear static FEA: STEP + explicit config -> Gmsh mesh -> CalculiX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["gmsh>=4.11", "numpy", "matplotlib", "tqdm"]

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest"]

[project.scripts]
talos = "talos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_gmsh: needs the gmsh Python module",
  "requires_ccx: needs the CalculiX ccx executable",
  "slow: long-running test",
]
