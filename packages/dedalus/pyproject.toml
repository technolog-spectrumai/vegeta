[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dedalus"
version = "0.1.0"
description = "Standalone parametric CAD on CadQuery: Python designs, STEP/STL export, measurements"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cadquery>=2.4", "numpy", "matplotlib", "tqdm"]

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest"]

[project.scripts]
dedalus = "dedalus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running test"]
