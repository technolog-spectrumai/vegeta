[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aeromant"
version = "0.1.0"
description = "Standalone aerodynamics on OpenFOAM: STL + known-good template case + explicit values"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "tqdm"]

[project.optional-dependencies]
pandas = ["pandas"]
test = ["pytest"]

[project.scripts]
aeromant = "aeromant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeromant = ["templates/*/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "requires_openfoam: needs OpenFOAM executables",
  "slow: long-running test",
]
