targets:
  stall_flaps_m_s:
    rule: <= 15.5
    why: a pass at 1.3 x stall closes on a 14 m/s quadcopter at 6 m/s or less (now 11-17 m/s)
  static_thrust_over_weight:
    rule: '>= 2.2'
    why: a nose-high flare held on the propellers with a fifth of the thrust left for control (now 1.84)
  radius_25_m:
    rule: <= 30.0
    why: inside a jinking quadcopter's ~30 m of swing (now 52 m)
  g_at_50_m_s:
    rule: '>= 8.0'
    why: the structure, not the wing, sets the turn from 50 m/s (now 6.4 g)
  top_speed_m_s:
    rule: '>= 70.0'
    why: a 50 m/s target is still overtaken with 20 m/s to spare
  full_power_min:
    rule: '>= 2.0'
    why: three passes with their turns back at full power (now 1.2 min)
  gust_to_stall_at_loiter_m_s:
    rule: '>= 5.0'
    why: the loiter survives a 5 m/s gust (now 2.7 m/s)
propellers:
  11x13 (library, pitched for the dash):
    static: 1.0
    fast: 1.0
    source: propulsion library
  11 in, pitched for slow flight (HAND):
    static: 1.45
    fast: 0.78
    source: 'HAND: momentum theory at a figure of merit 0.6 gives 190 N static for two; the fast end by the pitch ratio 10/13'
  13 in, pitched for slow flight (HAND):
    static: 1.62
    fast: 0.78
    source: 'HAND: the same, x (13/11)^(2/3); needs the motors 30 mm further out'
