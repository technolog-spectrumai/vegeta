1_shot:
  launcher:
    shots: 1
    kg: 0.99
    drag_area_cm2: 14.3
    source: net_drone.py results and golf_recoilless.shot (dev_net_launcher @ bb041dd); masses are hand estimates
  taken_off:
    legs_and_line_g: 242
    dropped_nets_and_tube_g: 286
  mass_kg: 5.76
  stall_spread_m_s: 20.2
  wing_loading_kg_m2: 22.1
  thrust_over_weight_at_32_m_s: 2.0
  geometry:
    muzzle_x_mm: 70
    muzzle_below_axis_mm: 169
    muzzle_ahead_of_the_propellers_mm: 142
    breech_x_mm: 447.0
    tilt_travel_deg:
    - 0.0
    - 15.0
    muzzle_below_axis_at_0_deg_mm: 68
    legs: 'left off: the breech''s jet is where they fold'
    depression_deg: 15.0
  pass:
    speed_m_s: 26.2
    bandit_m_s: 9.0
    closing_m_s: 17.2
    fire_between_m:
    - 4.0
    - 10.0
    time_in_range_s: 0.35
    net_flight_s:
    - 0.1
    - 0.25
    astor_above_the_bandit_m:
    - 1.2
    - 2.8
    net_half_span_m: 1.48
    net_speed_through_the_air_m_s: 66
    tested_at_m_s: 40.0
  recoil_if_the_rear_jet_were_blocked:
    impulse_Ns: 6.0
    speed_change_m_s: 1.04
    note: 'small on this mass: a plain closed breech would do'
  air_vessel:
    where: inside the fuselage, shaped to the tail cone (the dropped nets' tube was there); its front end above the breech
    from_x_mm: 385
    to_x_mm: 765
    length_mm: 380
    largest_diameter_mm: 64.0
    aft_diameter_mm: 54.9
    volume_l: 1.0
    pressure_bar: 29.8
    wall:
      mm: 1.5
      hoop_stress_MPa: 63.6
      note: aluminium at this stress has a large reserve; the mass stays gavilan_flight's 250 g (HAND)
    clear_of_the_skin_mm: 1.5
    feed_to_the_valve_mm: 41
    balance:
      vessel_g_with_margin: 312
      centre_moves_aft_mm: 274
      aircraft_cg_moves_aft_mm: 12.6
      pack_moves_forward_to_hold_it_mm: 56
      air_used_per_shot_g: 19.1
      cg_shift_per_shot_mm: -0.57
    drag:
      removed_cm2: 8.0
      source: gavilan_flight.NET_CDA's 0.0008 m2 for the vessel under the belly (HAND)
    displaced:
    - 'the parachute bay: forward under the glove (station 265)'
    - 'the dropped nets'' belly camera: removed'
    - 'the tail''s servo leads: in the 1.5 mm gap along the vessel (HAND)'
    - 'the two motor controllers: in the nacelles behind the motors (HAND: no room was ledgered for them in the body)'
    not_checked:
    - 'a stationed balance of ASTOR-TWIN (none exists yet: the flight model holds the CG at 365 mm)'
    - 'the tail halves'' spigot at station 655 crosses the body where the vessel is: it must pass over or under it (HAND)'
    - the pack's own fit in the 70 mm body
  untested:
  - 'the net opening when fired from an aircraft at 25 m/s (its tests: a fixed launcher, a hovering quadcopter)'
  - the rear jet along the belly
  - the balance with ~1 kg under the forward belly
