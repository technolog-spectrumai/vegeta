name: mancha

on:
  push:
    paths: ["libs/mancha/**", ".github/workflows/mancha.yml"]
  pull_request:
    paths: ["libs/mancha/**", ".github/workflows/mancha.yml"]

defaults:
  run:
    working-directory: libs/mancha

jobs:
  cpu:
    name: NumPy reference (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy pytest matplotlib
      - run: python -m pytest -q -p no:cacheprovider

  triton-interpreter:
    name: Triton kernels on the CPU (interpreter) and compiled for sm_80/sm_90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pytest torch triton --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q -p no:cacheprovider tests/test_triton_compile.py
      - run: python -m pytest -q -p no:cacheprovider tests/test_triton.py
        env:
          TRITON_INTERPRET: "1"

  gpu:
    # Needs a self-hosted runner labelled `gpu`; enable with the repository variable MANCHA_GPU_RUNNER=true.
    name: Triton backend on a CUDA GPU
    if: ${{ vars.MANCHA_GPU_RUNNER == 'true' }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install numpy pytest torch triton
      - run: python -m pytest -q -p no:cacheprovider -m gpu
      - run: python benchmarks/performance.py --sizes 64 128 256 --out results/performance.json
